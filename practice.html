<section>
<h2>اليوم 1: من الفاتورة إلى تكلفة الوحدة</h2>
<ol>
<li><p>في مسار الإعلانات، طلب مالك الإعلان 392 وحدة، والسجل يُظهر تسعة استدعاءات بمجموع 118,759 وحدة مفوترة. أي تفسير صحيح؟</p><ul><li><b>أ.</b> كل استدعاء يعيد إرسال التعليمات والطلب وما قرأه الوكيل وكتبه</li><li><b>ب.</b> المزوّد يعدّ وحدات النص العربي أضعافًا مضاعفة مقارنة بالنص الإنجليزي</li><li><b>ج.</b> وحدات الاستدلال المخفية هي معظم ما فُوتر في التشغيل كله</li><li><b>د.</b> الطلب أُرسل مرة واحدة، والباقي رسوم ثابتة على كل استدعاء</li></ul></li>
<li><p>مسار الإعلانات: 41 تشغيلًا على 36 مهمة، نجحت منها 29، والمجموع 539.89 ريالًا شاملًا المراجعة. يسأل بند الموازنة: كم نضع لكل إعلان ناجح؟</p><ul><li><b>أ.</b> 13.17 ريالًا: المجموع مقسومًا على التشغيلات الـ41</li><li><b>ب.</b> 12.83 ريالًا: وسيط تكلفة المهام الناجحة</li><li><b>ج.</b> 18.62 ريالًا: المجموع ÷ المهام الناجحة الـ29</li><li><b>د.</b> 12.46 ريالًا: متوسط تكلفة المهام الناجحة وحدها</li></ul></li>
<li><p>مسار الإعلانات: 1.70 ريال للطلب بالوحدات النصية؛ أو 1.20 ريال لكل حزمة مسلَّمة (0.97 لكل طلب) ورسم منصة 2,000 ريال؛ أو وحدة سعة بـ9,000 ريال تغطي 12,000 طلب. أي خيار أرخص عند 8,000 طلب في الشهر؟</p><ul><li><b>أ.</b> النتيجة: 9,600 ريال في الشهر</li><li><b>ب.</b> السعة: 9,000 ريال في الشهر</li><li><b>ج.</b> الوحدات النصية: 13,600 ريال في الشهر</li><li><b>د.</b> النتيجة: 11,312 ريالًا في الشهر</li></ul></li>
<li><p>فاتورة مسار يلخص القرارات المنشورة تُظهر وحدات مخرجات أكثر بثلاثة أضعاف من طول الملخصات التي قرأها الموظفون. النموذج المستعمل نموذج استدلال. ما التفسير الأرجح؟</p><ul><li><b>أ.</b> المدخلات المخزنة مؤقتًا تُضاف إلى المخرجات في الفاتورة</li><li><b>ب.</b> تعليمات النظام تُعدّ مع المخرجات في كل استدعاء</li><li><b>ج.</b> وحدات الاستدلال تُفوتَر مخرجات ولا تظهر في الرد</li><li><b>د.</b> النص العربي يُفوتَر مخرجات حتى حين يُرسل مدخلات</li></ul></li>
<li><p>تشغيل لوكيل من خمسة استدعاءات. في كل استدعاء تُرسل تعليمات النظام (2,000 وحدة) وطلب المستخدم (250 وحدة). ويُضاف إليهما سياق متراكم: 0 في الاستدعاء الأول، ثم 1,000، ثم 3,000، ثم 6,000، ثم 9,000. كم وحدة مدخلات في التشغيل كله؟ <span class="unit">(وحدة)</span></p></li>
<li><p>عرض من مورِّد يقول إن مسار الرد على أسئلة الموقع العام «يكلف 0.004 ريال للطلب»، وحسبه من طول السؤال وطول الجواب وسعر الوحدة. المسار وكيل يبحث في النصوص المنشورة ويتحقق قبل الرد. ما الخلل الأول في هذا الرقم؟</p><ul><li><b>أ.</b> يحسب السؤال والجواب معًا، والصحيح أن يحسب السؤال وحده</li><li><b>ب.</b> لا يسعّر ما تعيد الحلقة إرساله في كل استدعاء</li><li><b>ج.</b> يحسب بالريال، والمورِّد يفوتر بالدولار بسعر صرف متغير</li><li><b>د.</b> يفترض أن كل الأسئلة بالعربية</li></ul></li>
<li><p>إذا انخفض سعر الوحدة النصية إلى النصف، فلا بد أن ينخفض إنفاق مسار وكيلي إلى النصف.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مهمة في مسار ملخصات القرارات: تشغيلها الأول بلغ حد إعادة المحاولة بلا ناتج، ووحداته 3.20 ريال. التشغيل الثاني قُبل، ووحداته 2.10 ريال، ومراجعته 4 دقائق بأجر 2.50 ريال للدقيقة. كم تكلفة المهمة بالريال؟ <span class="unit">(ريال)</span></p></li>
<li><p>مسار الرد على أسئلة الموقع العام في شهر: 60 تشغيلًا على 52 مهمة، نجحت منها 40، والمجموع شاملًا المراجعة 1,200 ريال. كم المتوسط المحمَّل لكل مهمة ناجحة بالريال؟ <span class="unit">(ريال)</span></p></li>
<li><p>قبل رفع التقرير الشهري لمسار الإعلانات، اقترح زميل حذف 6 تشغيلات فاشلة من الملف لأنها «لم تنتج شيئًا يُراجع». ماذا تفعل؟</p><ul><li><b>أ.</b> تحذفها، فلا مراجعة عليها ولا ناتج لها</li><li><b>ب.</b> تحذفها من الحساب وتضيف في آخر التقرير حاشية بعددها</li><li><b>ج.</b> تنقلها إلى تقرير مستقل يقرؤه الفريق التقني وحده</li><li><b>د.</b> تبقيها في التكلفة وتذكر عددها في التقرير</li></ul></li>
<li><p>في مسار ملخصات القرارات: الوسيط 11 ريالًا، والمئين التسعون 26 ريالًا، لكل مهمة ناجحة. ماذا يقول الرقمان معًا؟</p><ul><li><b>أ.</b> نصف الناجحة تحت 11 ريالًا، وعُشرها فوق 26</li><li><b>ب.</b> متوسط تكلفة المهمة الناجحة 18.50 ريالًا، منتصف الرقمين</li><li><b>ج.</b> 90% من المهام الناجحة تكلف 26 ريالًا بالضبط</li><li><b>د.</b> المهام التي لم تنجح كلفت بين 11 و26 ريالًا</li></ul></li>
<li><p>التكلفة لكل طلب في مسار الإعلانات، شاملة التشغيلات الفاشلة والمراجعة، 15 ريالًا. نسبة النجاح المقيسة 80%، ويسألك المقيِّم: كم التكلفة لكل مهمة ناجحة لو انخفضت النسبة إلى 60%؟ <span class="unit">(ريال)</span></p></li>
<li><p>مسار الرد على أسئلة الموقع العام: 2.40 ريال للطلب بالوحدات النصية؛ أو عرض بالنتيجة: 1.50 ريال لكل حزمة مسلَّمة (0.96 حزمة لكل طلب) ورسم منصة 3,000 ريال في الشهر. عند أي حجم شهري يتعادل الخياران؟ <span class="unit">(طلب)</span></p></li>
<li><p>وحدة سعة مخصصة بـ20,000 ريال في الشهر تغطي 25,000 طلب في الشهر. المسار يعالج اليوم 5,000 طلب. كم يُستعمل من تغطية الوحدة، وكم يحمل كل طلب من السعة؟</p><ul><li><b>أ.</b> 20%، و4.00 ريالات لكل طلب</li><li><b>ب.</b> 100%، و0.80 ريال لكل طلب كما لو امتلأت الوحدة</li><li><b>ج.</b> 20%، و0.80 ريال لكل طلب</li><li><b>د.</b> 25%، و4.00 ريالات لكل طلب</li></ul></li>
<li><p>مورِّد يعرض وكيلًا للرد على أسئلة الجمهور بسعر لكل «نتيجة»، ويعدّ النتيجة حين لا يكتب السائل مرة أخرى بعد الرد. ماذا تطلب قبل مقارنة سعره بالخيارات الأخرى؟</p><ul><li><b>أ.</b> خصمًا على سعر النتيجة مقابل التزام سنة كاملة بحد أدنى</li><li><b>ب.</b> عدد النتائج التي فوترها لعملائه الآخرين</li><li><b>ج.</b> تعريف النتيجة مكتوبًا في العقد، ثم تقبل السعر كما هو</li><li><b>د.</b> عيّنة تقيس كم من «نتائجه» نجاح بتعريف جهتك</li></ul></li>
<li><p>المورِّد يعرض خصمًا 25% على السعة مقابل التزام سنة بعدد ثابت من الوحدات. مسار الإعلانات يعالج اليوم 4,000 طلب، وتتوقع الإدارة 12,000 إن نجح التوسع. عند أي حجم تحسب عدد الوحدات الملتزم بها؟</p><ul><li><b>أ.</b> عند 12,000، حجم التوسع الذي تأمله الإدارة</li><li><b>ب.</b> عند متوسط الحجمين، 8,000</li><li><b>ج.</b> عند أقل حجم تتوقعه بثقة طوال السنة</li><li><b>د.</b> عند حجم أعلى شهر في السنة الماضية</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الروافع والحوكمة</h2>
<ol>
<li><p>مسار ملخصات القرارات في شهر: 25 تشغيلًا على 22 مهمة، نجحت منها 16. المجموع شاملًا المراجعة 420 ريالًا، منها 36 ريالًا لتشغيلات فاشلة. كم المتوسط المحمَّل لكل مهمة ناجحة؟</p><ul><li><b>أ.</b> 26.25 ريالًا: 420 ÷ 16 مهمة ناجحة</li><li><b>ب.</b> 16.80 ريالًا: 420 ÷ 25 تشغيلًا</li><li><b>ج.</b> 19.09 ريالًا: 420 ÷ 22 مهمة</li><li><b>د.</b> 24.00 ريالًا: (420 − 36) ÷ 16 مهمة ناجحة</li></ul></li>
<li><p>في مسار الرد على أسئلة الموقع العام، وجّه الفريق المسودات إلى نموذج أصغر. الوحدات النصية لكل تشغيل انخفضت 60%، ونسبة النجاح نزلت من 82% إلى 74%، ودقائق المراجعة ارتفعت 12%. ماذا تكتب في جدول الروافع؟</p><ul><li><b>أ.</b> توفير 60% في تكلفة المسار</li><li><b>ب.</b> لا شيء: رافعة غيّرت الجودة لا تدخل الجدول أصلًا</li><li><b>ج.</b> توفير صافٍ 52%: 60% ناقصًا 8 نقاط نجاح</li><li><b>د.</b> التكلفة لكل نجاح شاملة المراجعة، ونزول النجاح</li></ul></li>
<li><p>قائد المنصة في مسار ملخصات القرارات اقترح تطبيق التوجيه إلى نموذج أصغر، وقياسه أظهر نزول نسبة القبول 5 نقاط. من يعتمد تطبيقه في خطة تفصل بين المهام؟</p><ul><li><b>أ.</b> قائد المنصة نفسه، فهو صاحب الاقتراح ومنفذه</li><li><b>ب.</b> مورِّد النموذج الأصغر، بعد عرضه نتائج مقارنة عامة</li><li><b>ج.</b> لجنة الاستثمار، بعد رأي من يراجع الناتج في المسار</li><li><b>د.</b> أي مدير في الإدارة التقنية التي يتبعها المسار</li></ul></li>
<li><p>رافعة خفضت تكلفة الوحدات النصية لكل تشغيل 30% في مسار ملخصات القرارات، ونزلت نسبة النجاح من 85% إلى 70%. كيف تكتبها في جدول الروافع؟</p><ul><li><b>أ.</b> توفير 30% في تكلفة المسار كله</li><li><b>ب.</b> تغير في التكلفة لكل نجاح، ومعه انخفاض في الجودة</li><li><b>ج.</b> توفير 30% ناقصًا 15 نقطة نجاح، أي توفير 15% صافٍ</li><li><b>د.</b> لا أثر يُكتب، فالنجاح والتكلفة تحركا في اتجاهين متعاكسين</li></ul></li>
<li><p>مسار ملخصات القرارات: المتوسط المحمَّل لكل مهمة ناجحة 24.00 ريالًا في خط الأساس، و21.60 ريالًا بعد رافعة لم تغيّر نسبة النجاح. كم نسبة التغير؟ اكتبها رقمًا سالبًا مقربًا إلى منزلة عشرية واحدة. <span class="unit">(%)</span></p></li>
<li><p>اقتراح في لجنة: «لو أوقفنا مراجعة أمناء البيانات لحزم النشر لانخفضت التكلفة لكل حزمة نحو 70%». كيف يُصنَّف هذا في خطة الروافع؟</p><ul><li><b>أ.</b> رافعة توفير، بشرط أن تبقى نسبة القبول السابقة</li><li><b>ب.</b> رافعة توفير تجرَّب شهرًا ثم تُقاس</li><li><b>ج.</b> تغيير في الجودة، لا توفير، ويُعرض بهذا الاسم</li><li><b>د.</b> رافعة توفير مؤقتة حتى تتحسن جودة النموذج</li></ul></li>
<li><p>في مسار الإعلانات خفّض التخزين المؤقت وحده الوحدات النصية لكل نجاح 50%، وخفّضها تقصير السياق وحده 40%. معًا خفّضاها 62%. لماذا لم يبلغ الأثر 90%؟</p><ul><li><b>أ.</b> التشغيل المجتمع فيه أخطاء قياس تُصحَّح بإعادته</li><li><b>ب.</b> التخزين المؤقت يتوقف عن العمل حين يُقصَّر السياق</li><li><b>ج.</b> الأثران يُضربان، فالنتيجة 50% × 40% = 20%</li><li><b>د.</b> تعملان على الوحدات نفسها، فتتداخلان</li></ul></li>
<li><p>تريد نائبة المحافظ مؤشرًا واحدًا شهريًّا لكل مسار ذكاء اصطناعي في تقرير القيادة. أي صياغة تختار؟</p><ul><li><b>أ.</b> التكلفة لكل مهمة ناجحة، مع نسبة النجاح</li><li><b>ب.</b> إجمالي الإنفاق على الوحدات النصية في الشهر</li><li><b>ج.</b> عدد الوحدات النصية المستهلكة في الشهر كله</li><li><b>د.</b> متوسط تكلفة التشغيل الواحد في الشهر</li></ul></li>
<li><p>مالكة مسار الإعلانات تطلب رفع حد الإنفاق لكل تشغيل من 40 إلى 90 ريالًا، استثناءً لحملة موسمية. من يعتمد الطلب في خطة تفصل بين المهام؟</p><ul><li><b>أ.</b> مالكة المسار نفسها، فهي أعلم من غيرها بحاجة الحملة</li><li><b>ب.</b> أي عضو في الفريق الذي يشغّل المسار يوميًّا</li><li><b>ج.</b> المورِّد، فهو يرى الاستهلاك ويعرف الحد المناسب قبل الجهة</li><li><b>د.</b> لجنة الاستثمار في الذكاء الاصطناعي، بعد رأي المالية</li></ul></li>
<li><p>في يوم واحد كلف مسار الإعلانات تسعة أضعاف يومه المعتاد: حلقة لم تتوقف بعد أن عطّل تغيير في الإعدادات حد إعادة المحاولة. أي ضبط كان سيوقفها في يومها؟</p><ul><li><b>أ.</b> تنبيه حين يبلغ إنفاق الشهر 80% من موازنته المعتمدة</li><li><b>ب.</b> حد لكل تشغيل مبني على توزيعه، وتنبيه يومي</li><li><b>ج.</b> مراجعة ربع سنوية لفاتورة المزوّد</li><li><b>د.</b> تقرير شهري بالإنفاق يرفع إلى القيادة</li></ul></li>
<li><p>يستند مدير مالية إلى إطار تبني الذكاء الاصطناعي الصادر عن سدايا (SDAIA-P121) في مذكرة عن موازنة الذكاء الاصطناعي. أي عبارة تصف القسم 3.1.3 (الميزانية) وصفًا صحيحًا؟</p><ul><li><b>أ.</b> يُلزم كل جهة بتخصيص 5 ملايين ريال سنويًّا للذكاء الاصطناعي</li><li><b>ب.</b> يوصي بتمويل مبادرات الذكاء الاصطناعي من بنود الطوارئ في الميزانية عند الحاجة إليها</li><li><b>ج.</b> يذكر من توجهاته بندًا ماليًّا مستقلًا للذكاء الاصطناعي في ميزانية الجهة</li><li><b>د.</b> يحصر تمويل الذكاء الاصطناعي في أنشطة البحث والتطوير والتجارب</li></ul></li>
<li><p>لخفض إعادة المحاولة في مسار حكومي، اقترح فريق أن يُرسل إلى الوكيل المستضاف سجل الطلبات كاملًا، وفيه أسماء مقدمي الطلبات وأرقام هواتفهم (مصنفة «مقيد»)، لأنه «يعطي النموذج سياقًا أفضل». ما الحكم؟</p><ul><li><b>أ.</b> يُرسل إن كان المزوّد معتمدًا لدى الجهة ومتعاقدًا معها</li><li><b>ب.</b> لا يُرسل: لا يدخل الأداة إلا ما صُنف «عامًّا»</li><li><b>ج.</b> يُرسل بعد إخفاء الأرقام وإبقاء الأسماء</li><li><b>د.</b> يُرسل إن خفّض التكلفة لكل مهمة ناجحة خفضًا مقيسًا</li></ul></li>
</ol>

 تشغيل من 40 إلى 90 ريالًا، استثناءً لحملة موسمية. من يعتمد الطلب في خطة تفصل بين المهام؟","options":[{"key":"أ","text":"مالكة المسار نفسها، فهي أعلم من غيرها بحاجة الحملة"},{"key":"ب","text":"أي عضو في الفريق الذي يشغّل المسار يوميًّا"},{"key":"ج","text":"المورِّد، فهو يرى الاستهلاك ويعرف الحد المناسب قبل الجهة"},{"key":"د","text":"لجنة الاستثمار في الذكاء الاصطناعي، بعد رأي المالية"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"صاحب الطلب لا يعتمد استثناءه، ولا من يتبعه. يعتمده من يملك قرار الاستثمار، بعد رأي المالية.","misconceptions":["تعتمد استثناءً طلبته بنفسها، وهو ما يمنعه الفصل بين المهام","فريق المسار تابع لصاحبة الطلب، فلا يفصل بين الطلب والاعتماد","المورِّد طرف يستفيد من رفع الحد، ولا يملك قرار موازنة الجهة",""],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"decision-rights","title":"من يطلب لا يعتمد طلبه، ومن يعتمد لا ينفذ وحده"},"level":"evaluate","pool":"practice"},{"id":"q-lo5-runaway-limit","type":"single","prompt":"في يوم واحد كلف مسار الإعلانات تسعة أضعاف يومه المعتاد: حلقة لم تتوقف بعد أن عطّل تغيير في الإعدادات حد إعادة المحاولة. أي ضبط كان سيوقفها في يومها؟","options":[{"key":"أ","text":"تنبيه حين يبلغ إنفاق الشهر 80% من موازنته المعتمدة"},{"key":"ب","text":"حد لكل تشغيل مبني على توزيعه، وتنبيه يومي"},{"key":"ج","text":"مراجعة ربع سنوية لفاتورة المزوّد"},{"key":"د","text":"تقرير شهري بالإنفاق يرفع إلى القيادة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"التشغيل الخارج عن السيطرة يُوقف على مستوى التشغيل واليوم، لا الشهر. حد لكل تشغيل مبني على التوزيع المقيس وتنبيه يومي يوقفانه في ساعاته الأولى.","misconceptions":["تنبيه الشهر يأتي بعد أن يُدفع المبلغ","","المراجعة الفصلية تكتشف ما حدث قبل أشهر","التقرير يصف الإنفاق ولا يوقف شيئًا"],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"alerts-limits","title":"ثلاث طبقات: حد لكل تشغيل، وتنبيه يومي، وموازنة شهرية"},"level":"apply","pool":"practice"},{"id":"q-lo5-adoption-budget","type":"single","prompt":"يستند مدير مالية إلى إطار تبني الذكاء الاصطناعي الصادر عن سدايا (SDAIA-P121) في مذكرة عن موازنة الذكاء الاصطناعي. أي عبارة تصف القسم 3.1.3 (الميزانية) وصفًا صحيحًا؟","options":[{"key":"أ","text":"يُلزم كل جهة بتخصيص 5 ملايين ريال سنويًّا للذكاء الاصطناعي"},{"key":"ب","text":"يوصي بتمويل مبادرات الذكاء الاصطناعي من بنود الطوارئ في الميزانية عند الحاجة إليها"},{"key":"ج","text":"يذكر من توجهاته بندًا ماليًّا مستقلًا للذكاء الاصطناعي في ميزانية الجهة"},{"key":"د","text":"يحصر تمويل الذكاء الاصطناعي في أنشطة البحث والتطوير والتجارب"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"القسم يذكر من التوجهات تخصيص ميزانية سنوية مستقلة ببند واضح بعيدًا عن المصادر الطارئة، ومبلغ الخمسة ملايين فيه مثال تطبيقي مبسط لا إلزام.","misconceptions":["يقرأ المثال التطبيقي في الإطار إلزامًا","الإطار يطلب الاستمرارية بعيدًا عن المصادر الطارئة أو غير المستقرة","","البحث والتطوير جزء من الميزانية في الإطار، لا كلها"],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"dedicated-budget","title":"إطار تبني الذكاء الاصطناعي يذكر بندًا مستقلًا للذكاء الاصطناعي في ميزانية الجهة"},"level":"understand","pool":"practice"},{"id":"q-lo5-genai-data","type":"single","prompt":"لخفض إعادة المحاولة في مسار حكومي، اقترح فريق أن يُرسل إلى الوكيل المستضاف سجل الطلبات كاملًا، وفيه أسماء مقدمي الطلبات وأرقام هواتفهم (مصنفة «مقيد»)، لأنه «يعطي النموذج سياقًا أفضل». ما الحكم؟","options":[{"key":"أ","text":"يُرسل إن كان المزوّد معتمدًا لدى الجهة ومتعاقدًا معها"},{"key":"ب","text":"لا يُرسل: لا يدخل الأداة إلا ما صُنف «عامًّا»"},{"key":"ج","text":"يُرسل بعد إخفاء الأرقام وإبقاء الأسماء"},{"key":"د","text":"يُرسل إن خفّض التكلفة لكل مهمة ناجحة خفضًا مقيسًا"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"مبادئ الذكاء الاصطناعي التوليدي للجهات الحكومية تمنع إدخال أي بيانات مصنفة مقيد فأعلى، وتقصر الاستخدام على البيانات «العامة». التوفير لا يغيّر التصنيف.","misconceptions":["اعتماد المزوّد لا يرفع منع إدخال البيانات المقيدة","","الأسماء وحدها بيانات شخصية تبقي السجل «مقيدًا»","يجعل التكلفة معيارًا لقرار يحكمه تصنيف البيانات"],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"genai-register","title":"لا يدخل أداة الذكاء الاصطناعي التوليدي إلا ما صُنف «عامًّا»، مهما كان التوفير"},"level":"evaluate","pool":"practice"}]}</script>
